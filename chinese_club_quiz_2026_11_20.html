<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Club Interactive Quiz</title>
<style>
:root{--bg:#071a2f;--panel:#0d2744;--panel2:#102f52;--gold:#e3b75d;--text:#f7f4ec;--muted:#b9c7d7;--green:#2ecc71;--red:#ff6b6b;--blue:#5bb8ff;--line:#294b6f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(180deg,#061525,#0a223c);color:var(--text);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px 16px 48px}header{border:1px solid #e3b75d55;background:#0d2744e8;border-radius:22px;padding:22px;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(26px,4vw,42px);color:var(--gold)}.subtitle{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#0a2038;color:var(--text);border-radius:999px;padding:10px 14px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--gold);color:#071a2f;font-weight:800}.topic{display:none}.topic.active{display:block}.topic-head{display:flex;justify-content:space-between;gap:12px;background:#0d2744b8;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.topic-title{font-size:22px;font-weight:800}.topic-note{color:var(--muted);margin-top:4px}.score{min-width:90px;text-align:center;border:1px solid #e3b75d66;background:#081b2f;border-radius:14px;padding:10px;color:var(--gold);font-weight:800}.cards{display:grid;gap:14px}.card{background:linear-gradient(180deg,#102f52f2,#0a2038f5);border:1px solid var(--line);border-radius:20px;padding:18px}.qtop{display:flex;gap:10px;align-items:center}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#071a2f;font-weight:900}.qtitle{font-weight:800}.prompt{font-size:18px;line-height:1.55;margin:12px 0}.options,.match-col{display:grid;gap:9px}.option,.chip,.match-btn,.picked{border:1px solid var(--line);background:#0b2139;color:var(--text);border-radius:14px;padding:11px 13px;cursor:pointer;font-size:16px}.option.selected,.chip.used,.match-btn.selected{border-color:var(--blue);background:#103a60}.option.correct,.match-btn.correct{border-color:var(--green);background:#2ecc7122}.option.wrong,.match-btn.wrong{border-color:var(--red);background:#ff6b6b22}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.action{border:none;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;background:var(--gold);color:#071a2f}.secondary{background:#163a5f;color:var(--text);border:1px solid var(--line)}.feedback{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;line-height:1.45}.feedback.show{display:block}.feedback.ok{background:#2ecc711a;border:1px solid #2ecc7177}.feedback.bad{background:#ff6b6b18;border:1px solid #ff6b6b77}.wordbank{display:flex;gap:8px;flex-wrap:wrap}.answerline{min-height:52px;border:1px dashed #52789d;border-radius:14px;padding:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#0002;margin-bottom:10px}.picked{cursor:default;background:#163a5f}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.done{display:none;margin-top:16px;border-radius:18px;padding:16px;text-align:center;background:#e3b75d1f;border:1px solid #e3b75d77}.done.show{display:block}.foot{margin-top:18px;color:#8fa5bd;font-size:13px;text-align:center}@media(max-width:680px){.topic-head{flex-direction:column}.match-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header><h1>中文口语课 · Interactive Quiz</h1><div class="subtitle">4 темы · по 5 коротких заданий · ответы и порядок перемешиваются при каждом запуске.</div></header>
<div class="tabs" id="tabs"></div><main id="topics"></main><div class="foot">Один автономный HTML/CSS/JavaScript-файл для GitHub Pages.</div>
</div>
<script>
"use strict";
const TOPICS=[
{id:"nearby",tab:"HSK1 · 我家附近有什么？",title:"我家附近有什么？",note:"Места рядом с домом · 有 / 在 · 远 / 近",questions:[
{type:"single",prompt:"Что означает 药店 (yàodiàn)?",options:["аптека","банк","кофейня","вокзал"],answer:"аптека",explain:"药店 yàodiàn — аптека."},
{type:"order",prompt:"Соберите: «Банк находится рядом с супермаркетом».",words:["银行","在","超市","旁边"],answer:["银行","在","超市","旁边"],explain:"银行在超市旁边。Yínháng zài chāoshì pángbiān."},
{type:"multi",prompt:"Выберите только слова, которые обозначают места.",options:["公园","学校","医院","远","附近"],answers:["公园","学校","医院"],explain:"公园 — парк, 学校 — школа, 医院 — больница."},
{type:"match",prompt:"Соедините место и перевод.",pairs:[["咖啡馆","кофейня"],["书店","книжный магазин"],["地铁站","станция метро"],["火车站","вокзал"]],explain:"Все пары — из лексики темы."},
{type:"single",prompt:"超市远吗？不远，_____五分钟。",options:["走路","生日","唱歌","今年"],answer:"走路",explain:"超市远吗？不远，走路五分钟。— Пять минут пешком."}
]},
{id:"birthday",tab:"HSK2 · 我的生日",title:"我的生日",note:"Дата · праздник · подарки · 先……然后……",questions:[
{type:"single",prompt:"Что означает 过生日 (guò shēngrì)?",options:["отмечать день рождения","получать подарок","есть торт","фотографировать"],answer:"отмечать день рождения",explain:"过生日 — отмечать день рождения."},
{type:"order",prompt:"Соберите: «Сначала поедим, потом съедим торт».",words:["我们","先","吃饭","然后","吃蛋糕"],answer:["我们","先","吃饭","然后","吃蛋糕"],explain:"我们先吃饭，然后吃蛋糕。"},
{type:"multi",prompt:"Что можно делать на дне рождения по материалу урока?",options:["唱歌","拍照","吃饭","去年","明年"],answers:["唱歌","拍照","吃饭"],explain:"唱歌 — петь, 拍照 — фотографировать, 吃饭 — есть вместе."},
{type:"match",prompt:"Соедините слово и перевод.",pairs:[["生日快乐","с днём рождения"],["蛋糕","торт"],["礼物","подарок"],["热闹","оживлённый / весёлый"]],explain:"Ключевая лексика темы."},
{type:"single",prompt:"Как спросить: «Когда у тебя день рождения?»",options:["你的生日是几月几号？","你生日那天常常做什么？","你最想收到什么礼物？","你喜欢热闹的生日还是安静的生日？"],answer:"你的生日是几月几号？",explain:"你的生日是几月几号？Nǐ de shēngrì shì jǐ yuè jǐ hào?"}
]},
{id:"week",tab:"HSK2–3 · 我的一周计划",title:"我的一周计划",note:"Планы · 要 / 准备 · 先……然后…… · 跟……一起……",questions:[
{type:"single",prompt:"周末 (zhōumò) — это…",options:["выходные","следующая неделя","утро","вечер"],answer:"выходные",explain:"周末 zhōumò — выходные."},
{type:"order",prompt:"Соберите: «В воскресенье сначала убираю комнату, потом иду гулять».",words:["星期天","我","先","打扫房间","然后","去散步"],answer:["星期天","我","先","打扫房间","然后","去散步"],explain:"星期天我先打扫房间，然后去散步。"},
{type:"multi",prompt:"Выберите действия / занятия из темы.",options:["看电影","运动","复习","旅游","下午","周末"],answers:["看电影","运动","复习","旅游"],explain:"看电影, 运动, 复习, 旅游 — действия / занятия."},
{type:"match",prompt:"Соедините слово и перевод.",pairs:[["有空","быть свободным"],["加班","работать сверхурочно"],["聚会","встреча / вечеринка"],["准备","собираться / готовиться"]],explain:"Все слова входят в лексику урока."},
{type:"single",prompt:"Выберите продолжение: 星期五我要加班，所以……",options:["不能去聚会","我要吃蛋糕","银行在超市旁边","生日快乐"],answer:"不能去聚会",explain:"星期五我要加班，所以不能去聚会。"}
]},
{id:"help",tab:"HSK4–5 · 见死不救",title:"见死不救你到底对不对",note:"Помощь · безопасность · мораль · ответственность",questions:[
{type:"single",prompt:"袖手旁观 (xiù shǒu páng guān) означает…",options:["стоять в стороне и не помогать","смело выйти вперёд и помочь","действовать по силам","вызвать полицию"],answer:"стоять в стороне и не помогать",explain:"袖手旁观 — стоять в стороне и не помогать."},
{type:"multi",prompt:"Какие действия помогают без прямого физического вмешательства?",options:["报警","拨打急救电话","寻求专业帮助","记录现场情况","冷眼旁观"],answers:["报警","拨打急救电话","寻求专业帮助","记录现场情况"],explain:"报警, 拨打急救电话, 寻求专业帮助 и 记录现场情况 — способы действовать; 冷眼旁观 — безучастно наблюдать."},
{type:"match",prompt:"Соедините выражение и значение.",pairs:[["量力而行","действовать по силам"],["挺身而出","смело выйти вперёд и помочь"],["好心办坏事","из добрых побуждений сделать хуже"],["事不关己","это меня не касается"]],explain:"Выражения из раздела 成语和口语表达."},
{type:"single",prompt:"不会急救的人贸然动手，可能……",options:["造成二次伤害","得到礼物","一起看电影","走路五分钟"],answer:"造成二次伤害",explain:"造成二次伤害 — нанести дополнительный вред."},
{type:"single",prompt:"Что лучше всего значит «помочь в пределах своих сил»?",options:["力所能及","奋不顾身","袖手旁观","冷眼旁观"],answer:"力所能及",explain:"力所能及 lì suǒ néng jí — в пределах своих сил."}
]}
];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const state={};TOPICS.forEach(t=>state[t.id]={answered:0,score:0});
const tabs=document.getElementById("tabs"),topics=document.getElementById("topics");
function typeLabel(t){return{single:"Выберите один ответ",multi:"Выберите все подходящие",order:"Соберите предложение",match:"Соедините пары"}[t]}
function renderTabs(){tabs.innerHTML="";TOPICS.forEach((t,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=t.tab;b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".topic").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("topic-"+t.id).classList.add("active")};tabs.appendChild(b)})}
function renderAll(){topics.innerHTML="";TOPICS.forEach((t,i)=>topics.appendChild(renderTopic(t,i===0)))}
function renderTopic(t,active){const s=document.createElement("section");s.className="topic"+(active?" active":"");s.id="topic-"+t.id;s.innerHTML=`<div class="topic-head"><div><div class="topic-title">${t.title}</div><div class="topic-note">${t.note}</div></div><div class="score" id="score-${t.id}">0 / 5</div></div><div class="cards"></div><div class="done" id="done-${t.id}"><b>Готово!</b> <span id="final-${t.id}"></span><div class="actions" style="justify-content:center"><button class="action" id="restart-${t.id}">Пройти ещё раз</button></div></div>`;const cards=s.querySelector(".cards");shuffle(t.questions).forEach((q,i)=>cards.appendChild(renderQuestion(t,q,i+1)));setTimeout(()=>{const r=document.getElementById("restart-"+t.id);if(r)r.onclick=()=>restart(t.id)},0);return s}
function renderQuestion(t,q,n){const c=document.createElement("div");c.className="card";c.dataset.done="0";c.innerHTML=`<div class="qtop"><div class="num">${n}</div><div class="qtitle">${typeLabel(q.type)}</div></div><div class="prompt">${q.prompt}</div>`;const b=document.createElement("div");c.appendChild(b);if(q.type==="single")single(t,q,c,b);if(q.type==="multi")multi(t,q,c,b);if(q.type==="order")order(t,q,c,b);if(q.type==="match")match(t,q,c,b);return c}
function feedback(c,ok,text){let f=c.querySelector(".feedback");if(!f){f=document.createElement("div");c.appendChild(f)}f.className="feedback show "+(ok?"ok":"bad");f.innerHTML=(ok?"✅ ":"❌ ")+text}
function finish(t,c,ok){if(c.dataset.done==="1")return;c.dataset.done="1";state[t.id].answered++;if(ok)state[t.id].score++;update(t.id)}
function update(id){const s=state[id],sc=document.getElementById("score-"+id);if(sc)sc.textContent=`${s.score} / 5`;if(s.answered===5){document.getElementById("final-"+id).textContent=`Результат: ${s.score} из 5.`;document.getElementById("done-"+id).classList.add("show")}}
function single(t,q,c,b){const o=document.createElement("div");o.className="options";shuffle(q.options).forEach(x=>{const bt=document.createElement("button");bt.className="option";bt.textContent=x;bt.onclick=()=>{if(c.dataset.done==="1")return;[...o.children].forEach(z=>z.disabled=true);const ok=x===q.answer;bt.classList.add(ok?"correct":"wrong");if(!ok)[...o.children].forEach(z=>{if(z.textContent===q.answer)z.classList.add("correct")});feedback(c,ok,q.explain);finish(t,c,ok)};o.appendChild(bt)});b.appendChild(o)}
function multi(t,q,c,b){const sel=new Set(),o=document.createElement("div");o.className="options";shuffle(q.options).forEach(x=>{const bt=document.createElement("button");bt.className="option";bt.textContent=x;bt.onclick=()=>{if(c.dataset.done==="1")return;if(sel.has(x)){sel.delete(x);bt.classList.remove("selected")}else{sel.add(x);bt.classList.add("selected")}};o.appendChild(bt)});b.appendChild(o);const a=document.createElement("div");a.className="actions";const check=document.createElement("button");check.className="action";check.textContent="Проверить";check.onclick=()=>{if(c.dataset.done==="1")return;const want=new Set(q.answers),ok=sel.size===want.size&&[...sel].every(x=>want.has(x));[...o.children].forEach(z=>{z.disabled=true;if(want.has(z.textContent))z.classList.add("correct");else if(sel.has(z.textContent))z.classList.add("wrong")});feedback(c,ok,q.explain);finish(t,c,ok)};a.appendChild(check);b.appendChild(a)}
function order(t,q,c,b){const ans=[],line=document.createElement("div");line.className="answerline";line.innerHTML='<span style="color:#8fa5bd">Нажимайте слова по порядку…</span>';b.appendChild(line);const bank=document.createElement("div");bank.className="wordbank";shuffle(q.words).forEach(w=>{const bt=document.createElement("button");bt.className="chip";bt.textContent=w;bt.onclick=()=>{if(c.dataset.done==="1"||bt.disabled)return;if(ans.length===0)line.innerHTML="";ans.push(w);bt.disabled=true;bt.classList.add("used");const p=document.createElement("span");p.className="picked";p.textContent=w;line.appendChild(p)};bank.appendChild(bt)});b.appendChild(bank);const a=document.createElement("div");a.className="actions";const check=document.createElement("button");check.className="action";check.textContent="Проверить";const clear=document.createElement("button");clear.className="action secondary";clear.textContent="Очистить";clear.onclick=()=>{if(c.dataset.done==="1")return;ans.length=0;line.innerHTML='<span style="color:#8fa5bd">Нажимайте слова по порядку…</span>';[...bank.children].forEach(z=>{z.disabled=false;z.classList.remove("used")})};check.onclick=()=>{if(c.dataset.done==="1")return;const ok=ans.length===q.answer.length&&ans.every((x,i)=>x===q.answer[i]);[...bank.children].forEach(z=>z.disabled=true);check.disabled=true;clear.disabled=true;feedback(c,ok,q.explain);finish(t,c,ok)};a.append(check,clear);b.appendChild(a)}
function match(t,q,c,b){const left=shuffle(q.pairs.map((p,i)=>({text:p[0],id:i}))),right=shuffle(q.pairs.map((p,i)=>({text:p[1],id:i})));let L=null,R=null,done=0,mistakes=0;const g=document.createElement("div");g.className="match-grid";const lc=document.createElement("div"),rc=document.createElement("div");lc.className=rc.className="match-col";function tryPair(){if(!L||!R)return;const ok=L.dataset.id===R.dataset.id;if(ok){L.classList.remove("selected");R.classList.remove("selected");L.classList.add("correct");R.classList.add("correct");L.disabled=R.disabled=true;done++;if(done===q.pairs.length){const perfect=mistakes===0;feedback(c,perfect,(perfect?"":"Все пары найдены, но были ошибки. ")+q.explain);finish(t,c,perfect)}}else{mistakes++;L.classList.add("wrong");R.classList.add("wrong");const a=L,d=R;setTimeout(()=>{a.classList.remove("wrong","selected");d.classList.remove("wrong","selected")},350)}L=R=null}
left.forEach(v=>{const bt=document.createElement("button");bt.className="match-btn";bt.textContent=v.text;bt.dataset.id=v.id;bt.onclick=()=>{if(c.dataset.done==="1"||bt.disabled)return;[...lc.children].forEach(z=>z.classList.remove("selected"));bt.classList.add("selected");L=bt;tryPair()};lc.appendChild(bt)});right.forEach(v=>{const bt=document.createElement("button");bt.className="match-btn";bt.textContent=v.text;bt.dataset.id=v.id;bt.onclick=()=>{if(c.dataset.done==="1"||bt.disabled)return;[...rc.children].forEach(z=>z.classList.remove("selected"));bt.classList.add("selected");R=bt;tryPair()};rc.appendChild(bt)});g.append(lc,rc);b.appendChild(g)}
function restart(id){state[id]={answered:0,score:0};const t=TOPICS.find(x=>x.id===id),old=document.getElementById("topic-"+id),active=old.classList.contains("active"),fresh=renderTopic(t,active);old.replaceWith(fresh);update(id)}
renderTabs();renderAll();
</script></body></html>
