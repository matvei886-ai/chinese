<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国婚礼 — интерактив</title>
<style>
:root{--n:#071a2d;--n2:#0d2945;--g:#d9ad55;--g2:#f2d58a;--ok:#16845a;--bad:#c84646}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"Noto Sans SC",sans-serif;background:linear-gradient(180deg,#ece4d6,#f7f8fa 360px);color:#172337}
header{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border-bottom:4px solid var(--g);padding:34px 18px 28px}.inner,main{max-width:900px;margin:auto}.brand{color:var(--g2);font-weight:900;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(30px,5vw,48px);margin:9px 0}header p{color:#d5e0e9;margin:0;line-height:1.5}
main{padding:16px 14px 45px}.stats{position:sticky;top:0;background:#f7f3eaf2;backdrop-filter:blur(8px);padding:10px 0;z-index:20}.row{display:flex;justify-content:space-between;font-weight:900;font-size:13px}.bar{height:9px;background:#dfe4e8;border-radius:99px;overflow:hidden;margin-top:7px}.bar div{height:100%;width:0;background:var(--g);transition:.2s}
.card{background:#fff;border:1px solid #e2ddd5;border-radius:20px;padding:20px;margin:13px 0;box-shadow:0 8px 24px #10223612}.num{font-size:12px;color:#8e6b2b;font-weight:900;letter-spacing:.08em}.q{font-size:20px;font-weight:900;margin:7px 0 11px;line-height:1.35}.opts{display:grid;gap:9px}
button{font:inherit;cursor:pointer}.opt{border:1.5px solid #cfd5dc;background:#fff;border-radius:13px;padding:11px 13px;text-align:left;transition:.12s}.opt:hover{border-color:var(--g)}.opt.sel{background:#fff7df;border-color:#9a762c}.opt.good{background:#eaf7f0;border-color:var(--ok);color:#126943}.opt.bad{background:#fff0f0;border-color:var(--bad);color:#9d3030}.opt:disabled{cursor:default}
.check,.restart{border:0;background:var(--n);color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;margin-top:10px}.fb{display:none;margin-top:12px;padding:12px;border-radius:12px;line-height:1.45}.fb.show{display:block}.fb.ok{background:#eaf7f0;color:#126943}.fb.no{background:#fff0f0;color:#9d3030}
.result{display:none;text-align:center;background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border:2px solid var(--g);border-radius:22px;padding:28px 18px;margin-top:18px}.result.show{display:block}.score{font-size:52px;color:var(--g2);font-weight:900}.note{font-size:13px;color:#687586;text-align:center;margin-top:12px}
</style></head><body>
<header><div class="inner"><div class="brand">КИТАЙСКИЙ С НОСИТЕЛЯМИ</div><h1>中国婚礼 · мини-интерактив</h1><p>7 заданий за раунд. При каждом новом прохождении вопросы и варианты ответов перемешиваются.</p></div></header>
<main><div class="stats"><div class="row"><span id="progress">0 / 7</span><span id="points">0 баллов</span></div><div class="bar"><div id="fill"></div></div></div><div id="quiz"></div><div class="result" id="result"><div class="score" id="score"></div><p id="msg"></p><button class="restart" onclick="newRound()">Новый вариант</button></div><div class="note">Материал составлен только по лекции «Почему китайская свадьба включает столько обрядов?»</div></main>
<script>
const BANK=[{"type": "choice", "q": "Что означает 三书六礼 sān shū liù lǐ?", "options": ["Три письма и шесть обрядов", "Три поклона", "Три золотых украшения", "Три свадебных банкета"], "answer": "Три письма и шесть обрядов", "exp": "Это традиционная система формальных этапов брака."}, {"type": "choice", "q": "Какой символ означает «двойное счастье»?", "options": ["囍", "福", "爱", "家"], "answer": "囍", "exp": "囍 / 双喜 часто используют в свадебном декоре."}, {"type": "choice", "q": "Что такое 彩礼 cǎilǐ?", "options": ["Предсвадебный дар со стороны жениха", "Подарок гостям после банкета", "Свадебная фотосессия", "Приданое со стороны невесты"], "answer": "Предсвадебный дар со стороны жениха", "exp": "В лекции 彩礼 противопоставляется 嫁妆 — приданому или подаркам со стороны невесты."}, {"type": "choice", "q": "Зачем жених может искать 婚鞋 hūnxié?", "options": ["Это часть весёлого испытания", "Чтобы выбрать размер обуви", "Чтобы подарить обувь гостям", "Это юридическое требование"], "answer": "Это часть весёлого испытания", "exp": "Туфли могут спрятать в комнате невесты; смысл — веселье и внимание к невесте."}, {"type": "choice", "q": "Что такое 堵门游戏 dǔmén yóuxì?", "options": ["Шуточные задания жениху у двери", "Церемония регистрации брака", "Выбор благоприятной даты", "Обмен кольцами"], "answer": "Шуточные задания жениху у двери", "exp": "Подруги невесты могут просить жениха петь, отвечать на вопросы и выполнять задания."}, {"type": "multi", "q": "Что относится к 拜堂 bàitáng в лекции?", "options": ["Поклон Небу и Земле", "Поклон родителям", "Поклон друг другу", "Поиск свадебных туфель"], "answers": ["Поклон Небу и Земле", "Поклон родителям", "Поклон друг другу"], "exp": "拜堂 описан как традиционный обряд трёх поклонов."}, {"type": "multi", "q": "Что верно про свадебные денежные подарки?", "options": ["Гости могут дарить деньги в красном конверте", "Сумма всегда фиксирована по всей стране", "Размер может зависеть от близости отношений", "Местные привычки имеют значение"], "answers": ["Гости могут дарить деньги в красном конверте", "Размер может зависеть от близости отношений", "Местные привычки имеют значение"], "exp": "Лекция подчёркивает, что единой фиксированной «цены входа» нет."}, {"type": "choice", "q": "Какой термин означает денежный подарок по случаю свадьбы?", "options": ["随份子 suí fènzi", "婚鞋 hūnxié", "领证 lǐng zhèng", "伴娘 bànniáng"], "answer": "随份子 suí fènzi", "exp": "随份子 — денежный подарок по случаю свадьбы."}, {"type": "choice", "q": "Что значит 领证 lǐng zhèng?", "options": ["Официально зарегистрировать брак", "Провести банкет", "Встретить невесту", "Подать чай родителям"], "answer": "Официально зарегистрировать брак", "exp": "В лекции регистрация брака отделяется от свадебной церемонии."}, {"type": "choice", "q": "Что отмечается о северных и южных свадьбах?", "options": ["Региональные различия есть, но семья и город важнее жёсткой схемы", "На севере всегда только дневные свадьбы", "На юге запрещены игровые элементы", "Все свадьбы проходят одинаково"], "answer": "Региональные различия есть, но семья и город важнее жёсткой схемы", "exp": "Примеры севера и Гуандуна даны как тенденции, а не строгие правила."}, {"type": "choice", "q": "Что такое 新中式婚礼 xīn zhōngshì hūnlǐ?", "options": ["Свадьба в новом китайском стиле", "Только западная свадьба", "Только древний ритуал", "Государственная регистрация"], "answer": "Свадьба в новом китайском стиле", "exp": "Современный формат может соединять старые и новые элементы."}, {"type": "choice", "q": "Какое утверждение соответствует лекции?", "options": ["Не все семьи соблюдают полный набор традиционных ритуалов", "Каждая свадьба обязана включать все старые обряды", "Белое платье в Китае не используется", "Формат свадьбы одинаков во всех регионах"], "answer": "Не все семьи соблюдают полный набор традиционных ритуалов", "exp": "Лекция постоянно отмечает различия между семьями, регионами и современными форматами."}],COUNT=7;let tasks=[],done=0,points=0,locked={};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){tasks=shuffle(BANK).slice(0,COUNT);done=0;points=0;locked={};document.getElementById('result').classList.remove('show');render();update();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const q=document.getElementById('quiz');q.innerHTML='';tasks.forEach((t,i)=>{const c=document.createElement('section');c.className='card';c.id='q'+i;let opts=shuffle(t.options);c.innerHTML=`<div class="num">ЗАДАНИЕ ${i+1}</div><div class="q">${t.q}</div><div class="opts">${opts.map(o=>`<button class="opt"></button>`).join('')}</div>${t.type==='multi'?'<button class="check">Проверить</button>':''}<div class="fb" id="fb${i}"></div>`;[...c.querySelectorAll('.opt')].forEach((b,k)=>{b.textContent=opts[k];b.dataset.value=opts[k]});q.appendChild(c)})}
function update(){document.getElementById('progress').textContent=`${done} / ${COUNT}`;document.getElementById('points').textContent=`${points} баллов`;document.getElementById('fill').style.width=(done/COUNT*100)+'%';if(done===COUNT){let r=document.getElementById('result');r.classList.add('show');document.getElementById('score').textContent=`${points} / ${COUNT}`;document.getElementById('msg').textContent=points>=6?'Отлично! Вы хорошо запомнили лекцию.':points>=4?'Хороший результат. Новый вариант поможет закрепить детали.':'Попробуйте ещё раз — вопросы перемешаются.';setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'center'}),120)}}
function feedback(i,ok,text){let f=document.getElementById('fb'+i);f.className='fb show '+(ok?'ok':'no');f.innerHTML=(ok?'✅ <b>Верно.</b> ':'❌ <b>Не совсем.</b> ')+text}
document.getElementById('quiz').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let card=b.closest('.card');if(!card)return;let i=+card.id.slice(1),t=tasks[i];if(locked[i])return;if(b.classList.contains('opt')&&t.type==='multi'){b.classList.toggle('sel');return}if(b.classList.contains('opt')&&t.type==='choice'){let val=b.dataset.value,ok=val===t.answer;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.value===t.answer)x.classList.add('good')});if(!ok)b.classList.add('bad');locked[i]=1;done++;if(ok)points++;feedback(i,ok,t.exp);update();return}if(b.classList.contains('check')){let sel=[...card.querySelectorAll('.opt.sel')].map(x=>x.dataset.value).sort(),ans=[...t.answers].sort(),ok=JSON.stringify(sel)===JSON.stringify(ans);card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(ans.includes(x.dataset.value))x.classList.add('good');else if(sel.includes(x.dataset.value))x.classList.add('bad')});locked[i]=1;done++;if(ok)points++;feedback(i,ok,t.exp);update()}});
newRound();
</script></body></html>
