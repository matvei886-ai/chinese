<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Clubs Interactive</title>
<style>
:root{--n:#071a2d;--n2:#0d2945;--g:#d9ad55;--g2:#f2d58a;--p:#f6f1e7;--ok:#16845a;--bad:#c84646}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:linear-gradient(#ece5d8,#f8f9fb 390px);color:#172337}
header{background:linear-gradient(135deg,var(--n),var(--n2));color:white;border-bottom:4px solid var(--g);padding:30px 18px}.inner,main{max-width:980px;margin:auto}.brand{color:var(--g2);font-size:12px;font-weight:900;letter-spacing:.15em}h1{font-size:clamp(29px,5vw,48px);margin:8px 0 6px}header p{margin:0;color:#d5e0e9}
main{padding:10px 14px 45px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:#f6f1e7f5;padding:10px 0;z-index:30}.tab{border:1px solid #cbd3db;background:#fff;color:var(--n);border-radius:999px;padding:11px 15px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:var(--n);color:#fff}.panel{display:none}.panel.active{display:block}.head,.card{background:white;border:1px solid #e1ddd5;border-radius:18px;padding:18px;margin:12px 0}.head h2{margin:0 0 5px}.head p{margin:0;color:#6c7785}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:0;background:var(--n);color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--n)}
.progress{position:sticky;top:64px;background:#f6f1e7f5;padding:9px 0;z-index:20}.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.bar{height:9px;background:#dfe4e8;border-radius:99px;overflow:hidden;margin-top:7px}.bar div{height:100%;width:0;background:var(--g)}
.num{font-size:12px;color:#8c692c;font-weight:800}.q{font-size:20px;font-weight:800;line-height:1.4;margin:7px 0 12px}.opts{display:grid;gap:8px}.opt,.token,.match{border:1.5px solid #cfd6dd;background:#fff;border-radius:12px;padding:11px 13px;font:inherit;text-align:left;cursor:pointer}.opt.sel,.match.sel{background:#fff6dc;border-color:#9a762c}.opt.good,.match.done{background:#eaf7f0;border-color:var(--ok);color:#126943}.opt.bad{background:#fff0f0;border-color:var(--bad);color:#9d3030}
.zone,.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:9px;border-radius:12px}.zone{border:2px dashed #cfd6dd;margin-bottom:8px}.tokens{background:#f4f6f8}.token.used{opacity:.3;pointer-events:none}.zone .token{background:#fff7df;border-color:#d5b362}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:grid;gap:8px}.match.wrong{background:#fff0f0;border-color:var(--bad)}.fb{display:none;margin-top:11px;padding:11px 13px;border-radius:12px}.fb.show{display:block}.fb.ok{background:#eaf7f0;color:#126943}.fb.no{background:#fff0f0;color:#9d3030}.result{display:none;text-align:center;background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border:2px solid var(--g);border-radius:20px;padding:24px;margin:18px 0}.result.show{display:block}.score{font-size:48px;color:var(--g2);font-weight:900}
@media(max-width:600px){.matchgrid{grid-template-columns:1fr}.card{padding:16px}.q{font-size:18px}}
</style></head><body>
<header><div class="inner"><div class="brand">КИТАЙСКИЙ С НОСИТЕЛЯМИ</div><h1>Интерактив по разговорным клубам</h1><p>4 темы · по 5 заданий · варианты и порядок перемешиваются.</p></div></header>
<main><nav class="tabs" id="tabs"></nav><div id="panels"></div></main>
<script>
const TOPICS=[{"id": "fruit", "tab": "HSK1 · 买水果", "title": "HSK1 — 在商店买水果", "subtitle": "Фрукты, цена, количество и диалог в магазине.", "tasks": [{"type": "match", "q": "Соедините фрукт с переводом.", "pairs": [["苹果", "яблоко"], ["香蕉", "банан"], ["葡萄", "виноград"], ["草莓", "клубника"]], "exp": "苹果 — яблоко; 香蕉 — банан; 葡萄 — виноград; 草莓 — клубника."}, {"type": "choice", "q": "Как спросить: «Сколько стоят яблоки за 500 г?»", "options": ["苹果多少钱一斤？", "这个多少钱？", "我要一斤苹果。", "还有香蕉吗？"], "answer": "苹果多少钱一斤？", "exp": "多少钱一斤？ = сколько стоит за 500 г?"}, {"type": "order", "q": "Соберите: «Я хочу купить два апельсина».", "tokens": ["我想买", "两个", "橙子"], "answer": ["我想买", "两个", "橙子"], "exp": "我想买两个橙子。"}, {"type": "multi", "q": "Что можно сказать продавцу во время покупки?", "options": ["我要一斤苹果。", "还有香蕉吗？", "那我还要一斤香蕉。", "我喜欢吃草莓。"], "answers": ["我要一斤苹果。", "还有香蕉吗？", "那我还要一斤香蕉。"], "exp": "Первые три фразы используются непосредственно в ситуации покупки."}, {"type": "choice", "q": "Яблоки — 10 元/斤, бананы — 8 元/斤. Вы берёте по 一斤 каждого. Сколько всего?", "options": ["18 块钱", "10 块钱", "8 块钱", "20 块钱"], "answer": "18 块钱", "exp": "10 + 8 = 18. 一共十八块钱。"}]}, {"id": "travel", "tab": "HSK2–3 · 旅行", "title": "HSK2–3 — 旅行的时候，你最看重什么？", "subtitle": "Путешествие, гостиница, сравнение и выбор.", "tasks": [{"type": "match", "q": "Соедините слово с переводом.", "pairs": [["假期", "отпуск / каникулы"], ["宾馆", "гостиница"], ["司机", "водитель"], ["满意", "довольный"]], "exp": "Это ключевая лексика темы путешествий."}, {"type": "choice", "q": "Как сказать: «Эта гостиница отличается от прошлой»?", "options": ["这家宾馆跟上次那家不一样。", "这家宾馆跟上次那家一样大。", "我哪儿都不想去。", "除了北京以外，我还想去上海。"], "answer": "这家宾馆跟上次那家不一样。", "exp": "A 跟 B 不一样 = A отличается от B."}, {"type": "order", "q": "Соберите: «Кроме Пекина, я ещё хочу поехать в Шанхай».", "tokens": ["除了北京以外，", "我还想去", "上海"], "answer": ["除了北京以外，", "我还想去", "上海"], "exp": "除了 A 以外，还 B = кроме A, ещё B."}, {"type": "multi", "q": "Выберите правильные модели со значением «никуда / ничего / ни одного».", "options": ["我哪儿都不想去。", "我什么也不想做。", "一个商店也没有。", "我还想去上海。"], "answers": ["我哪儿都不想去。", "我什么也不想做。", "一个商店也没有。"], "exp": "……也 / 都 + 不 / 没 выражает «никто / ничего / никуда / ни одного»."}, {"type": "choice", "q": "Отель A ближе, но маленький и дороже; B дальше, но большой и тихий. Какая фраза лучше начинает сравнение?", "options": ["宾馆A跟宾馆B不一样。", "今天太累了，我什么也不想做。", "除了坐飞机以外，也可以坐高铁。", "我哪儿都不想去。"], "answer": "宾馆A跟宾馆B不一样。", "exp": "Для сравнения двух гостиниц подходит A 跟 B 不一样."}]}, {"id": "shopping", "tab": "HSK2–3 · 网购", "title": "HSK2–3 — 网上买东西还是去商店？", "subtitle": "Онлайн-покупки, магазин и аргументация.", "tasks": [{"type": "match", "q": "Соедините слово с переводом.", "pairs": [["下单", "оформить заказ"], ["退货", "вернуть товар"], ["评价", "отзыв / оценка"], ["试穿", "примерять одежду"]], "exp": "Это ключевая лексика темы онлайн- и офлайн-покупок."}, {"type": "choice", "q": "Как спросить: «Ты предпочитаешь онлайн-покупки или магазин?»", "options": ["你喜欢网购还是去商店？", "你一般在哪里买衣服？", "如果质量不好，你怎么办？", "网上购物比去商店更方便。"], "answer": "你喜欢网购还是去商店？", "exp": "A 还是 B？ — выбор между двумя вариантами."}, {"type": "order", "q": "Соберите: «Поскольку удобно, я люблю онлайн-покупки».", "tokens": ["因为很方便，", "所以", "我喜欢网购"], "answer": ["因为很方便，", "所以", "我喜欢网购"], "exp": "因为……所以…… = потому что…, поэтому…"}, {"type": "multi", "q": "Какие фразы поддерживают идею «онлайн удобно, но магазин полезен для одежды»?", "options": ["网上购物比去商店更方便。", "虽然网购方便，但是我喜欢试穿。", "如果买衣服，我更喜欢去商店。", "我经常在网上买书。"], "answers": ["网上购物比去商店更方便。", "虽然网购方便，但是我喜欢试穿。", "如果买衣服，我更喜欢去商店。"], "exp": "Эти фразы прямо сравнивают два способа покупки или объясняют выбор магазина для одежды."}, {"type": "choice", "q": "Вы получили одежду плохого качества. Какая реакция соответствует теме?", "options": ["如果质量不好，我就退货。", "我想先看评价，再下单。", "网上有时候更便宜。", "我觉得网购很方便。"], "answer": "如果质量不好，我就退货。", "exp": "如果……就……: если качество плохое, я верну товар."}]}, {"id": "life", "tab": "HSK4–5 · 死亡时间", "title": "HSK4–5 — 假如你能看到自己的死亡时间", "subtitle": "Выбор, неизвестность, ответственность и смысл жизни.", "tasks": [{"type": "match", "q": "Соедините слово с переводом.", "pairs": [["倒计时", "обратный отсчёт"], ["命运", "судьба"], ["珍惜", "ценить / беречь"], ["遗憾", "сожаление"]], "exp": "Это ключевые слова дискуссии о времени и отношении к жизни."}, {"type": "choice", "q": "Что означает 活在当下 huó zài dāngxià?", "options": ["жить настоящим", "готовиться заранее", "положиться на судьбу", "хранить тайну"], "answer": "жить настоящим", "exp": "活在当下 — жить настоящим, текущим моментом."}, {"type": "order", "q": "Соберите: «Посвятить время семье».", "tokens": ["把时间", "留给", "家人"], "answer": ["把时间", "留给", "家人"], "exp": "把时间留给家人 — посвятить время семье."}, {"type": "multi", "q": "Какие выражения связаны с идеей ценить ограниченное время и жить полнее?", "options": ["争分夺秒", "向死而生", "珍惜每一天", "度日如年"], "answers": ["争分夺秒", "向死而生", "珍惜每一天"], "exp": "争分夺秒 — дорожить каждой минутой; 向死而生 — осознавая смерть, жить полнее; 珍惜每一天 — ценить каждый день."}, {"type": "choice", "q": "Какой вопрос означает: «Может ли неизвестность иногда защищать человека?»", "options": ["未知有时候是不是一种保护？为什么？", "你会把这件事告诉谁？", "你最想完成哪三件事？", "医生有权告诉一个人这种信息吗？"], "answer": "未知有时候是不是一种保护？为什么？", "exp": "Это вопрос из блока о возможных минусах знания точного времени."}]}],STATE={};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function boot(){
 tabs.innerHTML=TOPICS.map((t,i)=>`<button class="tab ${i?'':'active'}" data-id="${t.id}">${t.tab}</button>`).join('');
 panels.innerHTML=TOPICS.map((t,i)=>`<section class="panel ${i?'':'active'}" id="p-${t.id}"><div class="head"><h2>${t.title}</h2><p>${t.subtitle}</p><div class="tools"><span>5 коротких заданий</span><button class="btn" data-restart="${t.id}">Новый вариант</button></div></div><div class="progress"><div class="prow"><span id="pr-${t.id}"></span><span id="pt-${t.id}"></span></div><div class="bar"><div id="bar-${t.id}"></div></div></div><div id="q-${t.id}"></div><div class="result" id="res-${t.id}"><div class="score" id="sc-${t.id}"></div><p id="msg-${t.id}"></p><button class="btn" data-restart="${t.id}">Пройти ещё раз</button></div></section>`).join('');
 TOPICS.forEach(reset);bind();
}
function reset(t){STATE[t.id]={tasks:sh(t.tasks),done:0,score:0,lock:{},ord:{},mat:{}};document.getElementById('res-'+t.id).classList.remove('show');render(t);update(t.id)}
function render(t){
 let s=STATE[t.id],root=document.getElementById('q-'+t.id);root.innerHTML='';
 s.tasks.forEach((x,i)=>{let c=document.createElement('article');c.className='card';c.dataset.t=t.id;c.dataset.i=i;let h=`<div class="num">ЗАДАНИЕ ${i+1}</div><div class="q">${x.q}</div>`;
 if(x.type==='choice'){let o=sh(x.options);h+=`<div class="opts">${o.map(()=>'<button class="opt"></button>').join('')}</div>`;c.innerHTML=h+`<div class="fb" id="f-${t.id}-${i}"></div>`;[...c.querySelectorAll('.opt')].forEach((b,k)=>{b.textContent=o[k];b.dataset.v=o[k]})}
 if(x.type==='multi'){let o=sh(x.options);h+=`<div class="opts">${o.map(()=>'<button class="opt"></button>').join('')}</div><button class="btn checkm">Проверить</button>`;c.innerHTML=h+`<div class="fb" id="f-${t.id}-${i}"></div>`;[...c.querySelectorAll('.opt')].forEach((b,k)=>{b.textContent=o[k];b.dataset.v=o[k]})}
 if(x.type==='order'){let o=sh(x.tokens);s.ord[i]=[];h+=`<div class="zone" id="z-${t.id}-${i}"></div><div class="tokens">${o.map(()=>'<button class="token"></button>').join('')}</div><button class="btn checko">Проверить</button> <button class="btn alt resetorder">Сбросить</button>`;c.innerHTML=h+`<div class="fb" id="f-${t.id}-${i}"></div>`;[...c.querySelectorAll('.token')].forEach((b,k)=>{b.textContent=o[k];b.dataset.v=o[k]})}
 if(x.type==='match'){let L=sh(x.pairs.map(p=>p[0])),R=sh(x.pairs.map(p=>p[1]));s.mat[i]={l:null,r:null,n:0,err:0};h+=`<div class="matchgrid"><div class="col">${L.map(v=>`<button class="match left" data-v="${v}">${v}</button>`).join('')}</div><div class="col">${R.map(v=>`<button class="match right" data-v="${v}">${v}</button>`).join('')}</div></div>`;c.innerHTML=h+`<div class="fb" id="f-${t.id}-${i}"></div>`}
 root.appendChild(c)})}
function fb(t,i,ok,txt){let f=document.getElementById(`f-${t}-${i}`);f.className='fb show '+(ok?'ok':'no');f.innerHTML=(ok?'✅ ':'❌ ')+txt}
function finish(t,i,ok){let s=STATE[t];if(s.lock[i])return;s.lock[i]=1;s.done++;if(ok)s.score++;update(t)}
function update(id){let t=TOPICS.find(x=>x.id===id),s=STATE[id];pr=document.getElementById('pr-'+id);pr.textContent=`${s.done}/5`;document.getElementById('pt-'+id).textContent=`${s.score} баллов`;document.getElementById('bar-'+id).style.width=(s.done*20)+'%';if(s.done===5){let r=document.getElementById('res-'+id);r.classList.add('show');document.getElementById('sc-'+id).textContent=`${s.score}/5`;document.getElementById('msg-'+id).textContent=s.score===5?'Отлично! Всё без ошибок.':s.score>=3?'Хорошо! Попробуйте ещё раз — порядок изменится.':'Ещё один раунд поможет закрепить материал.'}}
function answerFor(task,left){let p=task.pairs.find(x=>x[0]===left);return p?p[1]:null}
function bind(){
 tabs.onclick=e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+b.dataset.id))};
 panels.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.restart){reset(TOPICS.find(x=>x.id===b.dataset.restart));return}let c=b.closest('.card');if(!c)return;let t=c.dataset.t,i=+c.dataset.i,s=STATE[t],x=s.tasks[i];if(s.lock[i])return;
 if(b.classList.contains('opt')&&x.type==='choice'){let ok=b.dataset.v===x.answer;c.querySelectorAll('.opt').forEach(y=>{y.disabled=true;if(y.dataset.v===x.answer)y.classList.add('good')});if(!ok)b.classList.add('bad');fb(t,i,ok,x.exp);finish(t,i,ok);return}
 if(b.classList.contains('opt')&&x.type==='multi'){b.classList.toggle('sel');return}
 if(b.classList.contains('checkm')){let g=[...c.querySelectorAll('.opt.sel')].map(y=>y.dataset.v).sort(),a=[...x.answers].sort(),ok=JSON.stringify(g)===JSON.stringify(a);c.querySelectorAll('.opt').forEach(y=>{y.disabled=true;if(a.includes(y.dataset.v))y.classList.add('good');else if(g.includes(y.dataset.v))y.classList.add('bad')});fb(t,i,ok,x.exp);finish(t,i,ok);return}
 if(b.classList.contains('token')){if(b.classList.contains('used'))return;b.classList.add('used');let rec={v:b.dataset.v,src:b};s.ord[i].push(rec);let chip=document.createElement('button');chip.className='token';chip.textContent=rec.v;chip.onclick=()=>{if(s.lock[i])return;let k=s.ord[i].indexOf(rec);if(k>=0)s.ord[i].splice(k,1);rec.src.classList.remove('used');chip.remove()};document.getElementById(`z-${t}-${i}`).appendChild(chip);return}
 if(b.classList.contains('resetorder')){s.ord[i].forEach(y=>y.src.classList.remove('used'));s.ord[i]=[];document.getElementById(`z-${t}-${i}`).innerHTML='';return}
 if(b.classList.contains('checko')){let g=s.ord[i].map(y=>y.v),ok=JSON.stringify(g)===JSON.stringify(x.answer);fb(t,i,ok,x.exp);finish(t,i,ok);return}
 if(b.classList.contains('match')){let m=s.mat[i],side=b.classList.contains('left')?'l':'r';c.querySelectorAll('.'+(side==='l'?'left':'right')).forEach(y=>y.classList.remove('sel'));b.classList.add('sel');m[side]=b;if(m.l&&m.r){let ok=answerFor(x,m.l.dataset.v)===m.r.dataset.v;if(ok){m.l.className='match left done';m.r.className='match right done';m.l.disabled=m.r.disabled=true;m.n++}else{m.err++;m.l.classList.add('wrong');m.r.classList.add('wrong');setTimeout(()=>{m.l&&m.l.classList.remove('wrong','sel');m.r&&m.r.classList.remove('wrong','sel')},250)}m.l=null;m.r=null;if(m.n===x.pairs.length){let perfect=m.err===0;fb(t,i,perfect,perfect?x.exp:`Все пары найдены, но были ошибки: ${m.err}. ${x.exp}`);finish(t,i,perfect)}}}
 }}
}
boot();
</script></body></html>
