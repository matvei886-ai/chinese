const state={};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clone(x){return JSON.parse(JSON.stringify(x))}
function init(l){state[l.id]={tasks:shuffle(l.bank.map(clone)).slice(0,l.pick),score:0,done:0,locked:{},build:{}}}
function buildUI(){LEVELS.forEach(init);tabs.innerHTML=LEVELS.map((l,i)=>`<button class="tab ${i?'':'active'}" data-id="${l.id}" onclick="switchTab('${l.id}')">${l.tab}</button>`).join('');panels.innerHTML=LEVELS.map((l,i)=>`<section class="panel ${i?'':'active'}" id="panel-${l.id}"><div class="levelHead"><h2>${l.title}</h2><p>${l.desc}</p><div class="note">Нажмите «Новый вариант», чтобы получить другой набор заданий и новый порядок ответов.</div></div><div class="progressWrap"><div class="progressRow"><span id="prog-${l.id}">0 / ${l.pick}</span><span id="score-${l.id}">Баллы: 0</span></div><div class="bar"><div id="bar-${l.id}"></div></div></div><div id="quiz-${l.id}"></div><div class="result" id="res-${l.id}"><div class="small">РЕЗУЛЬТАТ</div><div class="score" id="final-${l.id}"></div><p id="msg-${l.id}"></p><button class="btn gold" onclick="restart('${l.id}')">Новый вариант</button></div></section>`).join('');LEVELS.forEach(render)}
function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+id));window.scrollTo({top:document.querySelector('.tabs').offsetTop,behavior:'smooth'})}
function render(l){let s=state[l.id],root=document.getElementById('quiz-'+l.id);root.innerHTML='';s.tasks.forEach((t,i)=>{let c=document.createElement('div');c.className='card';c.id=`${l.id}-q${i}`;let h=`<div class="qnum">Задание ${i+1}</div><div class="qtitle">${t.q}</div>`;if(t.hint)h+=`<div class="hint">${t.hint}</div>`;if(t.cn)h+=`<div class="cn">${t.cn}</div>`;if(t.py)h+=`<div class="py">${t.py}</div>`;if(t.ru)h+=`<div class="ru">${t.ru}</div>`;if(t.t==='choice')h+=choice(l.id,i,t);if(t.t==='multi')h+=multi(l.id,i,t);if(t.t==='build')h+=build(l.id,i,t);h+=`<div class="feedback" id="${l.id}-fb${i}"></div>`;c.innerHTML=h;root.appendChild(c)});update(l.id)}
function choice(id,i,t){return `<div class="opts">${shuffle(t.o.map((x,idx)=>({x,idx}))).map(o=>`<button class="opt" data-real="${o.idx}" onclick="answer('${id}',${i},this,${o.idx})">${o.x}</button>`).join('')}</div>`}
function multi(id,i,t){return `<div class="opts" id="${id}-multi${i}">${shuffle(t.o.map((x,idx)=>({x,idx}))).map(o=>`<button class="opt" data-real="${o.idx}" onclick="this.classList.toggle('selected')">${o.x}</button>`).join('')}</div><button class="btn" onclick="checkMulti('${id}',${i})">Проверить</button>`}
function build(id,i,t){state[id].build[i]=[];return `<div class="answerzone" id="${id}-zone${i}"></div><div class="tokens">${shuffle(t.tokens).map(x=>`<button class="token" data-token="${x}" onclick="addToken('${id}',${i},this)">${x}</button>`).join('')}</div><button class="btn" onclick="checkBuild('${id}',${i})">Проверить</button><button class="btn secondary" onclick="resetBuild('${id}',${i})">Сбросить</button>`}
function fb(id,i,ok,e){let x=document.getElementById(`${id}-fb${i}`);x.className=`feedback show ${ok?'ok':'bad'}`;x.innerHTML=(ok?'✅ <b>Верно.</b> ':'❌ <b>Не совсем.</b> ')+e}
function finish(id,i,ok){let s=state[id];if(s.locked[i])return;s.locked[i]=1;s.done++;if(ok)s.score++;update(id);if(s.done===s.tasks.length)result(id)}
function answer(id,i,b,r){let s=state[id],t=s.tasks[i];if(s.locked[i])return;document.querySelectorAll(`#${id}-q${i} .opt`).forEach(x=>{x.disabled=true;if(+x.dataset.real===t.a)x.classList.add('correct')});let ok=r===t.a;if(!ok)b.classList.add('wrong');fb(id,i,ok,t.e);finish(id,i,ok)}
function checkMulti(id,i){let s=state[id],t=s.tasks[i];if(s.locked[i])return;let sel=[...document.querySelectorAll(`#${id}-multi${i} .opt.selected`)].map(x=>+x.dataset.real).sort((a,b)=>a-b),ans=[...t.a].sort((a,b)=>a-b),ok=JSON.stringify(sel)===JSON.stringify(ans);document.querySelectorAll(`#${id}-multi${i} .opt`).forEach(x=>{x.disabled=true;let r=+x.dataset.real;if(ans.includes(r))x.classList.add('correct');else if(sel.includes(r))x.classList.add('wrong')});fb(id,i,ok,t.e);finish(id,i,ok)}
function addToken(id,i,b){let s=state[id];if(s.locked[i]||b.classList.contains('used'))return;b.classList.add('used');let o={token:b.dataset.token,btn:b};s.build[i].push(o);let c=document.createElement('button');c.className='token';c.textContent=o.token;c.onclick=()=>{if(s.locked[i])return;s.build[i]=s.build[i].filter(x=>x!==o);b.classList.remove('used');c.remove()};document.getElementById(`${id}-zone${i}`).appendChild(c)}
function resetBuild(id,i){let s=state[id];if(s.locked[i])return;s.build[i].forEach(x=>x.btn.classList.remove('used'));s.build[i]=[];document.getElementById(`${id}-zone${i}`).innerHTML=''}
function checkBuild(id,i){let s=state[id],t=s.tasks[i];if(s.locked[i])return;let ok=JSON.stringify(s.build[i].map(x=>x.token))===JSON.stringify(t.a);fb(id,i,ok,t.e);finish(id,i,ok)}
function update(id){let s=state[id];document.getElementById('prog-'+id).textContent=`${s.done} / ${s.tasks.length}`;document.getElementById('score-'+id).textContent=`Баллы: ${s.score}`;document.getElementById('bar-'+id).style.width=(s.done/s.tasks.length*100)+'%'}
function result(id){let s=state[id],r=document.getElementById('res-'+id);r.classList.add('show');document.getElementById('final-'+id).textContent=`${s.score}/${s.tasks.length}`;let p=s.score/s.tasks.length;document.getElementById('msg-'+id).textContent=p>=.9?'Отлично! Материал освоен уверенно.':p>=.7?'Хорошо. Попробуйте ещё один вариант для закрепления.':'Пройдите ещё раз — новый вариант даст другие вопросы.';r.scrollIntoView({behavior:'smooth',block:'center'})}
function restart(id){let l=LEVELS.find(x=>x.id===id);init(l);document.getElementById('res-'+id).classList.remove('show');render(l);document.getElementById('panel-'+id).scrollIntoView({behavior:'smooth',block:'start'})}
buildUI();
</script>
</body></html>
