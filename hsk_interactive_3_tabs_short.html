<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK интерактивная практика</title>
<style>
:root{--n:#071a2d;--n2:#0d2945;--g:#d9ad55;--g2:#f2d58a;--ok:#16845a;--bad:#c84646}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#f7f3ea;color:#172337}
header{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;padding:32px 18px;border-bottom:4px solid var(--g)}
.inner,main{max-width:920px;margin:auto}h1{margin:6px 0}header p{color:#d9e3ec}
.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:#f7f3eaf2;padding:10px 0;z-index:10}
.tab{border:1px solid #ccd4dc;background:#fff;padding:10px 15px;border-radius:999px;font-weight:700;white-space:nowrap}
.tab.active{background:var(--n);color:#fff;border-color:var(--n)}main{padding:0 14px 40px}
.panel{display:none}.panel.active{display:block}.head,.card{background:#fff;border:1px solid #e2ddd5;border-radius:18px;padding:18px;margin:12px 0}
.progress{font-weight:700;margin:10px 0}.bar{height:9px;background:#dfe4e8;border-radius:20px;overflow:hidden}.bar div{height:100%;background:var(--g);width:0}
.qn{font-size:12px;color:#886827;font-weight:700}.qt{font-size:19px;font-weight:800;margin:7px 0}.hint{color:#6b7280;font-size:14px}
.cn{font-size:24px;font-weight:700;margin:8px 0}
.opts{display:grid;gap:8px;margin-top:10px}button{font:inherit;cursor:pointer}
.opt,.token{border:1.5px solid #cfd5db;background:#fff;border-radius:12px;padding:11px;text-align:left}
.opt.selected{background:#fff7df;border-color:#9a762c}.opt.correct{background:#eaf7f0;border-color:var(--ok)}.opt.wrong{background:#fff0f0;border-color:var(--bad)}
.zone,.tokens{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;padding:9px;border-radius:12px}.zone{border:2px dashed #d3d9df;margin-bottom:8px}.tokens{background:#f4f6f8}
.token.used{opacity:.3;pointer-events:none}.btn{background:var(--n);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;margin-top:9px}
.fb{display:none;padding:11px;border-radius:12px;margin-top:10px}.fb.show{display:block}.fb.ok{background:#eaf7f0;color:#126943}.fb.bad{background:#fff0f0;color:#9d3030}
.result{display:none;background:var(--n);color:#fff;border:2px solid var(--g);border-radius:18px;padding:22px;text-align:center;margin:15px 0}.result.show{display:block}
</style>
</head>
<body>
<header><div class="inner"><div style="color:var(--g2);font-weight:800">КИТАЙСКИЙ С НОСИТЕЛЯМИ</div><h1>Интерактивная практика HSK</h1><p>Небольшие задания по каждому уровню.</p></div></header>
<main><div class="tabs" id="tabs"></div><div id="panels"></div></main>
<script>
const LEVELS=[{"id": "hsk1", "tab": "HSK1 · 我的家人", "title": "HSK1 — 我的家人", "desc": "Семья, хобби, профессии и базовые модели 是 / 有 / 喜欢.", "tasks": [{"t": "choice", "q": "Что означает 家人?", "o": ["члены семьи", "работа", "юрист", "спорт"], "a": 0, "e": "家人 jiārén — члены семьи."}, {"t": "choice", "q": "Как сказать «Это мой папа»?", "o": ["这是我的爸爸。", "我家有爸爸。", "爸爸是家人。", "我喜欢爸爸。"], "a": 0, "e": "这是我的爸爸。"}, {"t": "choice", "q": "Как спросить «Сколько человек в твоей семье?»", "o": ["你家有几口人？", "你家是谁？", "你喜欢几个人？", "你家做什么？"], "a": 0, "e": "你家有几口人？"}, {"t": "build", "q": "Собери: «Мой папа любит смотреть кино»", "tokens": ["我的爸爸", "喜欢", "看电影"], "a": ["我的爸爸", "喜欢", "看电影"], "e": "我的爸爸喜欢看电影。"}, {"t": "multi", "q": "Выбери все профессии", "o": ["护士", "律师", "运动", "看书"], "a": [0, 1], "e": "护士 — медсестра, 律师 — юрист."}]}, {"id": "rent", "tab": "HSK2–3 · 租房子", "title": "HSK2–3 — 租房子", "desc": "Лексика аренды и 想 / 想要, 比, 虽然…但是…, 如果…就….", "tasks": [{"t": "choice", "q": "Что означает 押金?", "o": ["залог, депозит", "арендная плата", "мебель", "хозяин"], "a": 0, "e": "押金 yājīn — залог, депозит."}, {"t": "choice", "q": "Как сказать «Я хочу квартиру с мебелью»?", "o": ["我想要一个有家具的房子。", "我想家具一个房子。", "我比家具房子。", "我租家具。"], "a": 0, "e": "想要 + существительное."}, {"t": "choice", "q": "Выбери правильное сравнение", "hint": "«Эта квартира немного дешевле той.»", "o": ["这个房子比那个房子便宜一点儿。", "虽然这个房子便宜。", "如果这个房子便宜。", "这个房子想要便宜。"], "a": 0, "e": "A 比 B + прилагательное."}, {"t": "build", "q": "Собери: «Хотя квартира небольшая, зато тихая»", "tokens": ["虽然房子不大", "但是", "很安静"], "a": ["虽然房子不大", "但是", "很安静"], "e": "虽然房子不大，但是很安静。"}, {"t": "choice", "q": "Закончи фразу", "cn": "如果房租合适，______。", "o": ["我就租这个房子", "但是很安静", "我比房东", "我想要家具"], "a": 0, "e": "如果 + условие, 就 + решение."}]}, {"id": "hsk4", "tab": "HSK4 · 辩论", "title": "HSK4 — 辩论是求胜还是求真", "desc": "Позиция, аргументы, доказательства, опровержение и поиск истины.", "tasks": [{"t": "choice", "q": "Что означает 求真?", "o": ["стремиться к истине", "стремиться к победе", "убеждать аудиторию", "менять мнение"], "a": 0, "e": "求真 qiúzhēn — стремиться к истине."}, {"t": "choice", "q": "Как сказать «предоставлять доказательства»?", "o": ["提供证据", "坚持立场", "赢得比赛", "指出漏洞"], "a": 0, "e": "提供证据 tígōng zhèngjù."}, {"t": "choice", "q": "Что означает 对事不对人?", "o": ["обсуждать вопрос, а не нападать на человека", "каждая сторона настаивает на своём", "вырывать слова из контекста", "признавать ошибку"], "a": 0, "e": "对事不对人 — обсуждать вопрос, а не нападать на человека."}, {"t": "multi", "q": "Выбери конструктивные действия в дебатах", "o": ["有理有据", "尊重对手", "承认错误", "偷换概念"], "a": [0, 1, 2], "e": "偷换概念 — подмена понятия, это неконструктивный приём."}, {"t": "build", "q": "Собери выражение: «приближаться к истине»", "tokens": ["接近", "真相"], "a": ["接近", "真相"], "e": "接近真相 — приближаться к истине."}]}];
const state={};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function init(){
 let tabs=document.getElementById('tabs'),panels=document.getElementById('panels');
 tabs.innerHTML=LEVELS.map((l,i)=>`<button class="tab ${i?'':'active'}" data-id="${l.id}">${l.tab}</button>`).join('');
 panels.innerHTML=LEVELS.map((l,i)=>`<section class="panel ${i?'':'active'}" id="p-${l.id}"><div class="head"><h2>${l.title}</h2><p>${l.desc}</p></div><div class="progress"><span id="pr-${l.id}">0 / ${l.tasks.length}</span> · <span id="sc-${l.id}">0 баллов</span><div class="bar"><div id="bar-${l.id}"></div></div></div><div id="q-${l.id}"></div><div class="result" id="r-${l.id}"><h2 id="rs-${l.id}"></h2><p>Готово!</p></div></section>`).join('');
 LEVELS.forEach(render); bind();
}
function render(l){
 state[l.id]={done:0,score:0,locked:{},build:{}};
 let root=document.getElementById('q-'+l.id);root.innerHTML='';
 l.tasks.forEach((t,i)=>{
  let c=document.createElement('div');c.className='card';c.id=`${l.id}-${i}`;
  let h=`<div class="qn">Задание ${i+1}</div><div class="qt">${t.q}</div>${t.hint?`<div class="hint">${t.hint}</div>`:''}${t.cn?`<div class="cn">${t.cn}</div>`:''}`;
  if(t.t==='choice') h+=`<div class="opts">${sh(t.o.map((x,k)=>[x,k])).map(x=>`<button class="opt" data-r="${x[1]}">${x[0]}</button>`).join('')}</div>`;
  if(t.t==='multi') h+=`<div class="opts">${sh(t.o.map((x,k)=>[x,k])).map(x=>`<button class="opt" data-r="${x[1]}">${x[0]}</button>`).join('')}</div><button class="btn checkm">Проверить</button>`;
  if(t.t==='build'){state[l.id].build[i]=[];h+=`<div class="zone" id="z-${l.id}-${i}"></div><div class="tokens">${sh(t.tokens).map(x=>`<button class="token" data-t="${x}">${x}</button>`).join('')}</div><button class="btn checkb">Проверить</button>`}
  h+=`<div class="fb" id="f-${l.id}-${i}"></div>`;c.innerHTML=h;root.appendChild(c)
 })
}
function upd(id){
 let l=LEVELS.find(x=>x.id===id),s=state[id];
 document.getElementById('pr-'+id).textContent=`${s.done} / ${l.tasks.length}`;
 document.getElementById('sc-'+id).textContent=`${s.score} баллов`;
 document.getElementById('bar-'+id).style.width=(s.done/l.tasks.length*100)+'%';
 if(s.done===l.tasks.length){let r=document.getElementById('r-'+id);r.classList.add('show');document.getElementById('rs-'+id).textContent=`${s.score} / ${l.tasks.length}`}
}
function fb(id,i,ok,e){let f=document.getElementById(`f-${id}-${i}`);f.className='fb show '+(ok?'ok':'bad');f.innerHTML=(ok?'✅ Верно. ':'❌ Не совсем. ')+e}
function finish(id,i,ok){let s=state[id];if(s.locked[i])return;s.locked[i]=1;s.done++;if(ok)s.score++;upd(id)}
function bind(){
 document.getElementById('tabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+b.dataset.id))};
 document.getElementById('panels').onclick=e=>{
  let b=e.target.closest('button');if(!b)return;let c=b.closest('.card');if(!c)return;
  let [id,si]=c.id.split('-');let i=+si,l=LEVELS.find(x=>x.id===id),t=l.tasks[i],s=state[id];if(s.locked[i])return;
  if(b.classList.contains('opt')&&t.t==='choice'){let r=+b.dataset.r;c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.r===t.a)x.classList.add('correct')});let ok=r===t.a;if(!ok)b.classList.add('wrong');fb(id,i,ok,t.e);finish(id,i,ok);return}
  if(b.classList.contains('opt')&&t.t==='multi'){b.classList.toggle('selected');return}
  if(b.classList.contains('checkm')){let sel=[...c.querySelectorAll('.opt.selected')].map(x=>+x.dataset.r).sort(),ans=[...t.a].sort(),ok=JSON.stringify(sel)===JSON.stringify(ans);c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;let r=+x.dataset.r;if(ans.includes(r))x.classList.add('correct');else if(sel.includes(r))x.classList.add('wrong')});fb(id,i,ok,t.e);finish(id,i,ok);return}
  if(b.classList.contains('token')){if(b.classList.contains('used'))return;b.classList.add('used');s.build[i].push(b.dataset.t);let chip=document.createElement('button');chip.className='token';chip.textContent=b.dataset.t;document.getElementById(`z-${id}-${i}`).appendChild(chip);return}
  if(b.classList.contains('checkb')){let ok=JSON.stringify(s.build[i])===JSON.stringify(t.a);fb(id,i,ok,t.e);finish(id,i,ok)}
 }
}
init();
</script>
</body></html>
